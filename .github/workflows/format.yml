name: format

# Fails the build if any tracked C# file isn't dotnet-format clean. This is the
# durable backstop behind the commit hooks: even if a hook is bypassed or
# misconfigured, drift can never land on main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify formatting
        run: |
          set -euo pipefail
          dotnet format BookshelfReader.sln --verify-no-changes
