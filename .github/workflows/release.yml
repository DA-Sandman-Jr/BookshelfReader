name: Release to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # The package includes the Windows-only OpenCV native runtime.
    runs-on: windows-latest

    # Trusted Publishing: no long-lived API key. The job's OIDC token is
    # exchanged for a one-hour nuget.org API key against the trusted publishing
    # policy configured on nuget.org (repository owner DA-Sandman-Jr,
    # repository BookshelfReader, workflow file release.yml).
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Release tag must contain a semantic version."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore BookshelfReader.sln

      - name: Build
        run: dotnet build BookshelfReader.sln --configuration Release --no-restore -p:Version=$env:VERSION -p:B44AgentSyncVerifyOnly=true /nodeReuse:false -p:UseSharedCompilation=false -m:1

      - name: Test
        run: dotnet test BookshelfReader.sln --configuration Release --no-build --verbosity minimal /nodeReuse:false -p:UseSharedCompilation=false -m:1

      - name: Pack
        run: dotnet pack BookshelfReader/BookshelfReader.csproj --configuration Release --no-build -p:Version=$env:VERSION --output ./nupkgs

      - name: Verify the package was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "nupkgs/BookshelfReader.$env:VERSION.nupkg")) {
            throw "Missing expected package: BookshelfReader.$env:VERSION.nupkg"
          }

      # Request the temp key right before the push; it expires after an hour.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Enumerate explicitly: dotnet nuget push does not expand wildcards on
      # Windows/pwsh the way it does on Linux.
      - name: Push packages to nuget.org
        shell: pwsh
        run: |
          foreach ($pkg in Get-ChildItem -Path nupkgs -Filter *.nupkg) {
            dotnet nuget push $pkg.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet push failed for $($pkg.Name)."
            }
          }
